<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的生活轨迹</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap');
        
        * {
            font-family: 'Noto Sans SC', sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 25%, #f093fb 50%, #f5576c 75%, #4facfe 100%);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            min-height: 100vh;
        }
        
        body.dark-mode {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 25%, #0f3460 50%, #533483 75%, #2b2d42 100%);
        }
        
        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        .dark-mode .glass-card {
            background: rgba(30, 30, 50, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .device-icon {
            width: 100px;
            height: 100px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
        }
        
        .device-icon:hover {
            transform: translateY(-10px) scale(1.1);
            background: rgba(255, 255, 255, 0.4);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }
        
        .device-icon i {
            font-size: 36px;
            margin-bottom: 8px;
        }
        
        .device-icon span {
            font-size: 12px;
            font-weight: 500;
        }
        
        .float {
            animation: float 3s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }
        
        /* 朋友圈样式 */
        .moments-card {
            background: white;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        
        .dark-mode .moments-card {
            background: #2a2a3e;
        }
        
        .moments-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }
        
        .moments-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 18px;
            flex-shrink: 0;
        }
        
        .moments-images {
            display: grid;
            gap: 4px;
            margin-top: 12px;
        }
        
        .moments-images.grid-1 { grid-template-columns: 1fr; }
        .moments-images.grid-2 { grid-template-columns: repeat(2, 1fr); }
        .moments-images.grid-3 { grid-template-columns: repeat(3, 1fr); }
        .moments-images.grid-4 { grid-template-columns: repeat(2, 1fr); }
        
        .moments-img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .moments-img:hover {
            transform: scale(1.02);
        }
        
        .moments-actions {
            display: flex;
            justify-content: space-around;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #f0f0f0;
        }
        
        .dark-mode .moments-actions {
            border-top-color: #3a3a4e;
        }
        
        .moments-action {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #666;
            cursor: pointer;
            transition: color 0.2s;
            font-size: 14px;
        }
        
        .moments-action:hover {
            color: #667eea;
        }
        
        .moments-action.liked {
            color: #e74c3c;
        }
        
        /* 打卡样式 */
        .checkin-card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }
        
        .dark-mode .checkin-card {
            background: #2a2a3e;
        }
        
        .streak-badge {
            background: linear-gradient(135deg, #f093fb, #f5576c);
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        
        .checkin-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 32px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .checkin-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }
        
        .checkin-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            margin-top: 16px;
        }
        
        .calendar-day {
            aspect-ratio: 1;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .calendar-day.today {
            border: 2px solid #667eea;
        }
        
        .calendar-day.checked {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }
        
        .calendar-day.missed {
            background: #fee2e2;
            color: #ef4444;
        }
        
        .calendar-day.future {
            color: #ccc;
        }
        
        .history-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .dark-mode .history-item {
            border-bottom-color: #3a3a4e;
        }
        
        .history-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }
        
        .history-icon.success {
            background: #dcfce7;
            color: #22c55e;
        }
        
        .history-icon.missed {
            background: #fee2e2;
            color: #ef4444;
        }
        
        /* 导航栏 */
        .nav-link {
            position: relative;
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 8px;
            transition: all 0.2s;
        }
        
        .nav-link:hover,
        .nav-link.active {
            background: rgba(102, 126, 234, 0.1);
            color: #667eea;
        }
        
        .fade-in {
            animation: fadeIn 0.5s ease-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* 发布朋友圈输入框 */
        .publish-box {
            background: white;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        
        .dark-mode .publish-box {
            background: #2a2a3e;
        }
        
        .publish-input {
            width: 100%;
            border: none;
            outline: none;
            resize: none;
            font-size: 16px;
            line-height: 1.6;
            min-height: 80px;
        }
        
        .publish-images {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 12px;
        }
        
        .publish-img {
            width: 80px;
            height: 80px;
            border-radius: 8px;
            object-fit: cover;
        }
        
        .add-img-btn {
            width: 80px;
            height: 80px;
            border: 2px dashed #ddd;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            color: #999;
        }
        
        .add-img-btn:hover {
            border-color: #667eea;
            color: #667eea;
        }
        
        /* 进度条 */
        .progress-ring {
            transform: rotate(-90deg);
        }
        
        .progress-ring circle {
            transition: stroke-dashoffset 0.3s;
        }
        
        /* 响应式 */
        @media (max-width: 640px) {
            .calendar-grid {
                gap: 4px;
            }
            
            .calendar-day {
                font-size: 12px;
            }
        }
    </style>
</head>
<body class="min-h-screen">
    <!-- 首页 -->
    <section id="home" class="min-h-screen flex flex-col items-center justify-center p-8">
        <div class="text-center mb-16 fade-in">
            <h1 class="text-5xl md:text-7xl font-bold text-white mb-4 drop-shadow-lg">
                🌟 我的生活轨迹
            </h1>
            <p class="text-xl text-white/80 font-light">记录每一天的美好</p>
        </div>
        
        <div class="flex gap-8 md:gap-12 fade-in">
            <div class="device-icon float" style="animation-delay: 0s" onclick="enterSite('mobile')">
                <i class="fas fa-mobile-alt"></i>
                <span>手机</span>
            </div>
            <div class="device-icon float" style="animation-delay: 0.5s" onclick="enterSite('tablet')">
                <i class="fas fa-tablet-alt"></i>
                <span>平板</span>
            </div>
            <div class="device-icon float" style="animation-delay: 1s" onclick="enterSite('desktop')">
                <i class="fas fa-desktop"></i>
                <span>电脑</span>
            </div>
        </div>
    </section>
    
    <!-- 主站内容 -->
    <section id="main" class="hidden relative z-10">
        <!-- 导航栏 -->
        <nav class="fixed top-0 left-0 right-0 z-50 glass-card shadow-lg">
            <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
                <div class="flex items-center gap-3 cursor-pointer" onclick="goHome()">
                    <div class="w-10 h-10 rounded-full bg-gradient-to-r from-purple-500 to-pink-500 flex items-center justify-center text-white">
                        <i class="fas fa-star"></i>
                    </div>
                    <span class="font-bold text-lg">我的轨迹</span>
                </div>
                
                <div class="flex items-center gap-2">
                    <button class="nav-link active" onclick="switchTab('life')">
                        <i class="fas fa-heart mr-1"></i>生活
                    </button>
                    <button class="nav-link" onclick="switchTab('study')">
                        <i class="fas fa-book mr-1"></i>学习
                    </button>
                </div>
                
                <div class="flex items-center gap-3">
                    <button onclick="toggleDarkMode()" class="text-xl hover:scale-110 transition-transform">
                        <i id="themeIcon" class="fas fa-moon"></i>
                    </button>
                    <button onclick="goHome()" class="text-sm px-4 py-2 bg-gradient-to-r from-purple-500 to-pink-500 text-white rounded-full hover:shadow-lg transition-all">
                        <i class="fas fa-home mr-1"></i>
                    </button>
                </div>
            </div>
        </nav>
        
        <div class="max-w-4xl mx-auto px-4 pt-20 pb-20">
            
            <!-- ========== 生活部分（朋友圈） ========== -->
            <div id="lifeTab" class="fade-in">
                <!-- 用户信息头部 -->
                <div class="glass-card rounded-2xl p-6 mb-6">
                    <div class="flex items-center gap-4">
                        <div class="w-20 h-20 rounded-2xl bg-gradient-to-r from-purple-500 to-pink-500 flex items-center justify-center text-white text-3xl shadow-lg">
                            ✨
                        </div>
                        <div>
                            <h2 class="text-2xl font-bold">小可爱</h2>
                            <p class="text-gray-500">保持热爱，奔赴山海 🌊</p>
                        </div>
                    </div>
                </div>
                
                <!-- 发布新动态 -->
                <div class="publish-box">
                    <textarea id="newPost" class="publish-input dark-mode:text-white" placeholder="分享你的生活点滴..."></textarea>
                    
                    <div id="previewImages" class="publish-images hidden"></div>
                    
                    <div class="flex justify-between items-center mt-4">
                        <div class="flex gap-3">
                            <label class="cursor-pointer text-gray-400 hover:text-purple-500 transition-colors">
                                <i class="fas fa-camera text-xl"></i>
                                <input type="file" id="postImages" class="hidden" accept="image/*" multiple onchange="previewPostImages(event)">
                            </label>
                            <label class="cursor-pointer text-gray-400 hover:text-purple-500 transition-colors">
                                <i class="fas fa-map-marker-alt text-xl"></i>
                            </label>
                            <label class="cursor-pointer text-gray-400 hover:text-purple-500 transition-colors">
                                <i class="fas fa-smile text-xl"></i>
                            </label>
                        </div>
                        <button onclick="publishPost()" class="px-6 py-2 bg-gradient-to-r from-purple-500 to-pink-500 text-white rounded-full text-sm font-medium hover:shadow-lg transition-all">
                            发布
                        </button>
                    </div>
                </div>
                
                <!-- 朋友圈动态列表 -->
                <div id="momentsList">
                    <!-- 动态会在这里动态生成 -->
                </div>
            </div>
            
            <!-- ========== 学习部分 ========== -->
            <div id="studyTab" class="hidden fade-in">
                <!-- 学习统计卡片 -->
                <div class="grid grid-cols-2 gap-4 mb-6">
                    <div class="glass-card rounded-2xl p-5 text-center">
                        <div class="text-3xl mb-2">📚</div>
                        <div class="text-2xl font-bold text-purple-600" id="totalEnglish">0</div>
                        <div class="text-sm text-gray-500">英语打卡天数</div>
                    </div>
                    <div class="glass-card rounded-2xl p-5 text-center">
                        <div class="text-3xl mb-2">🎸</div>
                        <div class="text-2xl font-bold text-pink-600" id="totalMusic">0</div>
                        <div class="text-sm text-gray-500">乐器练习天数</div>
                    </div>
                </div>
                
                <!-- 英语学习 -->
                <div class="checkin-card">
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <h3 class="text-xl font-bold flex items-center gap-2">
                                <span class="text-2xl">📚</span> 英语学习
                            </h3>
                            <p class="text-gray-500 text-sm mt-1">每天进步一点点</p>
                        </div>
                        <div class="streak-badge">
                            <i class="fas fa-fire"></i>
                            连续 <span id="englishStreak">0</span> 天
                        </div>
                    </div>
                    
                    <!-- 本月日历 -->
                    <div class="mb-4">
                        <div class="flex justify-between items-center mb-3">
                            <button onclick="changeMonth('english', -1)" class="text-gray-400 hover:text-purple-500">
                                <i class="fas fa-chevron-left"></i>
                            </button>
                            <span class="font-medium" id="englishMonth">2026年8月</span>
                            <button onclick="changeMonth('english', 1)" class="text-gray-400 hover:text-purple-500">
                                <i class="fas fa-chevron-right"></i>
                            </button>
                        </div>
                        
                        <div class="grid grid-cols-7 gap-1 text-center text-xs text-gray-400 mb-2">
                            <div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div><div>日</div>
                        </div>
                        
                        <div id="englishCalendar" class="calendar-grid"></div>
                    </div>
                    
                    <!-- 打卡按钮 -->
                    <div class="text-center">
                        <button id="englishCheckinBtn" onclick="checkin('english')" class="checkin-btn mx-auto">
                            <i class="fas fa-check-circle"></i>
                            今日打卡
                        </button>
                    </div>
                    
                    <!-- 学习记录 -->
                    <div class="mt-6">
                        <h4 class="font-bold mb-3 text-gray-600">最近记录</h4>
                        <div id="englishHistory" class="space-y-0">
                            <!-- 动态生成 -->
                        </div>
                    </div>
                    
                    <!-- 学习笔记输入 -->
                    <div class="mt-4 p-4 bg-gray-50 rounded-xl dark-mode:bg-gray-800">
                        <textarea id="englishNote" class="w-full bg-transparent outline-none resize-none text-sm" placeholder="记录今天的学习内容...&#10;例如：背了50个单词，看了2集美剧" rows="3"></textarea>
                    </div>
                </div>
                
                <!-- 乐器学习 -->
                <div class="checkin-card">
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <h3 class="text-xl font-bold flex items-center gap-2">
                                <span class="text-2xl">🎸</span> 乐器学习
                            </h3>
                            <p class="text-gray-500 text-sm mt-1">享受音乐的美好</p>
                        </div>
                        <div class="streak-badge">
                            <i class="fas fa-fire"></i>
                            连续 <span id="musicStreak">0</span> 天
                        </div>
                    </div>
                    
                    <!-- 本月日历 -->
                    <div class="mb-4">
                        <div class="flex justify-between items-center mb-3">
                            <button onclick="changeMonth('music', -1)" class="text-gray-400 hover:text-purple-500">
                                <i class="fas fa-chevron-left"></i>
                            </button>
                            <span class="font-medium" id="musicMonth">2026年8月</span>
                            <button onclick="changeMonth('music', 1)" class="text-gray-400 hover:text-purple-500">
                                <i class="fas fa-chevron-right"></i>
                            </button>
                        </div>
                        
                        <div class="grid grid-cols-7 gap-1 text-center text-xs text-gray-400 mb-2">
                            <div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div><div>日</div>
                        </div>
                        
                        <div id="musicCalendar" class="calendar-grid"></div>
                    </div>
                    
                    <!-- 打卡按钮 -->
                    <div class="text-center">
                        <button id="musicCheckinBtn" onclick="checkin('music')" class="checkin-btn mx-auto">
                            <i class="fas fa-check-circle"></i>
                            今日打卡
                        </button>
                    </div>
                    
                    <!-- 学习记录 -->
                    <div class="mt-6">
                        <h4 class="font-bold mb-3 text-gray-600">最近记录</h4>
                        <div id="musicHistory" class="space-y-0">
                            <!-- 动态生成 -->
                        </div>
                    </div>
                    
                    <!-- 学习笔记输入 -->
                    <div class="mt-4 p-4 bg-gray-50 rounded-xl dark-mode:bg-gray-800">
                        <textarea id="musicNote" class="w-full bg-transparent outline-none resize-none text-sm" placeholder="记录今天的练习内容...&#10;例如：练习了30分钟吉他，学会了一首新歌" rows="3"></textarea>
                    </div>
                </div>
            </div>
        </div>
    </section>
    
    <script>
        // ========== 数据存储 ==========
        let appData = {
            moments: [],
            english: { checkedDates: [], notes: {} },
            music: { checkedDates: [], notes: {} }
        };
        
        // 从 localStorage 加载数据
        function loadData() {
            const saved = localStorage.getItem('myLifeTracker');
            if (saved) {
                appData = JSON.parse(saved);
            } else {
                // 添加示例数据
                appData.moments = [
                    {
                        id: 1,
                        content: '今天天气真好，出去散步了～',
                        images: [],
                        time: '2026-08-17 14:30',
                        likes: 3,
                        liked: false,
                        location: '公园'
                    },
                    {
                        id: 2,
                        content: '学会了一首新歌，开心！🎵',
                        images: [],
                        time: '2026-08-16 20:15',
                        likes: 5,
                        liked: true,
                        location: '家'
                    }
                ];
                saveData();
            }
        }
        
        // 保存数据到 localStorage
        function saveData() {
            localStorage.setItem('myLifeTracker', JSON.stringify(appData));
        }
        
        // ========== 网站导航 ==========
        function enterSite(device) {
            document.getElementById('home').classList.add('hidden');
            document.getElementById('main').classList.remove('hidden');
            
            loadData();
            renderMoments();
            renderCalendar('english');
            renderCalendar('music');
            updateStats();
            checkTodayStatus();
        }
        
        function goHome() {
            document.getElementById('home').classList.remove('hidden');
            document.getElementById('main').classList.add('hidden');
        }
        
        function switchTab(tab) {
            document.querySelectorAll('.nav-link').forEach(el => el.classList.remove('active'));
            event.target.classList.add('active');
            
            document.getElementById('lifeTab').classList.toggle('hidden', tab !== 'life');
            document.getElementById('studyTab').classList.toggle('hidden', tab !== 'study');
        }
        
        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            const icon = document.getElementById('themeIcon');
            if (document.body.classList.contains('dark-mode')) {
                icon.classList.replace('fa-moon', 'fa-sun');
            } else {
                icon.classList.replace('fa-sun', 'fa-moon');
            }
        }
        
        // ========== 朋友圈功能 ==========
        let selectedImages = [];
        
        function previewPostImages(event) {
            const files = Array.from(event.target.files);
            const container = document.getElementById('previewImages');
            container.innerHTML = '';
            container.classList.remove('hidden');
            
            selectedImages = [];
            
            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    selectedImages.push(e.target.result);
                    const img = document.createElement('img');
                    img.src = e.target.result;
                    img.className = 'publish-img';
                    container.appendChild(img);
                }
                reader.readAsDataURL(file);
            });
        }
        
        function publishPost() {
            const content = document.getElementById('newPost').value.trim();
            if (!content && selectedImages.length === 0) {
                alert('请输入内容或添加图片');
                return;
            }
            
            const now = new Date();
            const timeStr = now.getFullYear() + '-' + 
                           String(now.getMonth() + 1).padStart(2, '0') + '-' + 
                           String(now.getDate()).padStart(2, '0') + ' ' + 
                           String(now.getHours()).padStart(2, '0') + ':' + 
                           String(now.getMinutes()).padStart(2, '0');
            
            const newPost = {
                id: Date.now(),
                content: content,
                images: [...selectedImages],
                time: timeStr,
                likes: 0,
                liked: false,
                location: ''
            };
            
            appData.moments.unshift(newPost);
            saveData();
            
            // 清空输入
            document.getElementById('newPost').value = '';
            document.getElementById('previewImages').innerHTML = '';
            document.getElementById('previewImages').classList.add('hidden');
            document.getElementById('postImages').value = '';
            selectedImages = [];
            
            renderMoments();
        }
        
        function renderMoments() {
            const container = document.getElementById('momentsList');
            container.innerHTML = appData.moments.map(post => `
                <div class="moments-card fade-in">
                    <div class="moments-header">
                        <div class="moments-avatar">小</div>
                        <div>
                            <div class="font-bold">小可爱</div>
                            <div class="text-xs text-gray-400">${post.time} ${post.location ? '· ' + post.location : ''}</div>
                        </div>
                    </div>
                    
                    <div class="text-gray-700 dark-mode:text-gray-300">${post.content}</div>
                    
                    ${post.images.length > 0 ? `
                        <div class="moments-images grid-${Math.min(post.images.length, 4)}">
                            ${post.images.map(img => `
                                <img src="${img}" class="moments-img" onclick="window.open('${img}')">
                            `).join('')}
                        </div>
                    ` : ''}
                    
                    <div class="moments-actions">
                        <div class="moments-action ${post.liked ? 'liked' : ''}" onclick="toggleLike(${post.id})">
                            <i class="fas fa-heart"></i>
                            <span>${post.likes}</span>
                        </div>
                        <div class="moments-action" onclick="alert('评论功能开发中')">
                            <i class="far fa-comment"></i>
                            <span>评论</span>
                        </div>
                        <div class="moments-action" onclick="alert('已复制分享链接')">
                            <i class="fas fa-share"></i>
                            <span>分享</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }
        
        function toggleLike(postId) {
            const post = appData.moments.find(p => p.id === postId);
            if (post) {
                post.liked = !post.liked;
                post.likes += post.liked ? 1 : -1;
                saveData();
                renderMoments();
            }
        }
        
        // ========== 打卡功能 ==========
        let currentMonths = {
            english: new Date().getMonth(),
            music: new Date().getMonth()
        };
        
        function changeMonth(type, delta) {
            currentMonths[type] += delta;
            if (currentMonths[type] > 11) {
                currentMonths[type] = 0;
            } else if (currentMonths[type] < 0) {
                currentMonths[type] = 11;
            }
            renderCalendar(type);
        }
        
        function renderCalendar(type) {
            const data = appData[type];
            const month = currentMonths[type];
            const year = new Date().getFullYear();
            
            document.getElementById(type + 'Month').textContent = `${year}年${month + 1}月`;
            
            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const startWeekday = firstDay.getDay() === 0 ? 7 : firstDay.getDay();
            
            const today = new Date();
            const todayStr = formatDate(today);
            
            let html = '';
            
            // 填充月初空白
            for (let i = 1; i < startWeekday; i++) {
                html += '<div class="calendar-day"></div>';
            }
            
            // 生成每一天
            for (let day = 1; day <= lastDay.getDate(); day++) {
                const date = new Date(year, month, day);
                const dateStr = formatDate(date);
                const isToday = dateStr === todayStr;
                const isChecked = data.checkedDates.includes(dateStr);
                const isFuture = date > today;
                
                let classes = 'calendar-day';
                if (isToday) classes += ' today';
                if (isChecked) classes += ' checked';
                if (isFuture) classes += ' future';
                
                html += `<div class="${classes}" title="${dateStr}">${day}</div>`;
            }
            
            document.getElementById(type + 'Calendar').innerHTML = html;
        }
        
        function formatDate(date) {
            return date.getFullYear() + '-' + 
                   String(date.getMonth() + 1).padStart(2, '0') + '-' + 
                   String(date.getDate()).padStart(2, '0');
        }
        
        function checkin(type) {
            const today = formatDate(new Date());
            const data = appData[type];
            
            if (data.checkedDates.includes(today)) {
                alert('今天已经打过卡啦！');
                return;
            }
            
            // 获取笔记
            const noteEl = document.getElementById(type + 'Note');
            const note = noteEl.value.trim();
            
            data.checkedDates.push(today);
            if (note) {
                data.notes[today] = note;
            }
            
            saveData();
            renderCalendar(type);
            updateStats();
            checkTodayStatus();
            renderHistory(type);
            
            // 清空笔记
            noteEl.value = '';
            
            // 显示成功动画
            showCheckinSuccess();
        }
        
        function showCheckinSuccess() {
            const btn = event.target.closest('.checkin-btn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-check"></i> 打卡成功！';
            btn.style.background = 'linear-gradient(135deg, #22c55e, #16a34a)';
            
            setTimeout(() => {
                btn.innerHTML = originalText;
                btn.style.background = '';
            }, 2000);
        }
        
        function checkTodayStatus() {
            const today = formatDate(new Date());
            
            ['english', 'music'].forEach(type => {
                const btn = document.getElementById(type + 'CheckinBtn');
                const isChecked = appData[type].checkedDates.includes(today);
                
                if (isChecked) {
                    btn.disabled = true;
                    btn.innerHTML = '<i class="fas fa-check-double"></i> 今日已打卡';
                } else {
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-check-circle"></i> 今日打卡';
                }
            });
        }
        
        function updateStats() {
            document.getElementById('totalEnglish').textContent = appData.english.checkedDates.length;
            document.getElementById('totalMusic').textContent = appData.music.checkedDates.length;
            
            // 计算连续天数
            ['english', 'music'].forEach(type => {
                const dates = appData[type].checkedDates.sort().reverse();
                let streak = 0;
                const today = new Date();
                
                for (let i = 0; i < 365; i++) {
                    const checkDate = new Date(today);
                    checkDate.setDate(checkDate.getDate() - i);
                    const dateStr = formatDate(checkDate);
                    
                    if (dates.includes(dateStr)) {
                        streak++;
                    } else if (i > 0) {
                        break;
                    }
                }
                
                document.getElementById(type + 'Streak').textContent = streak;
            });
        }
        
        function renderHistory(type) {
            const container = document.getElementById(type + 'History');
            const data = appData[type];
            const recentDates = data.checkedDates.sort().reverse().slice(0, 7);
            
            container.innerHTML = recentDates.map(date => `
                <div class="history-item">
                    <div class="history-icon success">
                        <i class="fas fa-check"></i>
                    </div>
                    <div class="flex-1">
                        <div class="font-medium">${date}</div>
                        ${data.notes[date] ? `<div class="text-sm text-gray-500">${data.notes[date]}</div>` : ''}
                    </div>
                </div>
            `).join('') || '<div class="text-center text-gray-400 py-4">暂无记录</div>';
        }
        
        // 初始化
        loadData();
        renderHistory('english');
        renderHistory('music');
    </script>
</body>
</html>
